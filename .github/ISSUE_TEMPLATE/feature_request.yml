name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the problem or the task you want to make easier.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could the app help?
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Links, screenshots, examples from other server managers…
